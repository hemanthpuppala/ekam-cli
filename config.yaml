providers:
  ollama:
    enabled: true
    host: http://localhost:11434
    timeout_seconds: 600  # Increased from 120 to 600 for VLM inference
  huggingface:
    enabled: true
    cache_dir: ~/.cache/huggingface/hub/
    device_preference:
    - cuda
    - mps
    - cpu
    hf_token: ${HF_TOKEN}  # Set via environment variable
  lm_studio:
    enabled: false
    host: http://localhost:1234
  gguf:
    enabled: true
    models_dir: ~/models/gguf/
    device_preference:
    - cuda
    - mps
    - cpu
  quantized:
    enabled: true
    models_dir: results/quantizations/
    device_preference:
    - cuda
    - mps
    - cpu
  mlx:
    enabled: false
    models_dir: ~/.cache/mlx/models
  openvino:
    enabled: false
    models_dir: ~/.cache/openvino/models
system:
  max_image_dimension: 1920
  memory_safety_margin_gb: 1.0
  default_timeout_seconds: 600  # Increased from 120 to 600 for VLM inference
